  componentDidMount() {
    this._tid = 0;
    this._scrollTimers = new Map();
    // restore dark mode preference
    const _savedDark = localStorage.getItem('fpt-cms-dark') === '1';
    if (_savedDark) { this.setState({ darkMode: true }); document.documentElement.setAttribute('data-theme', 'dark'); }
    const onScroll = (e) => {
      const el = e.currentTarget;
      el.classList.add('is-scrolling');
      clearTimeout(this._scrollTimers.get(el));
      this._scrollTimers.set(el, setTimeout(() => el.classList.remove('is-scrolling'), 800));
    };
    const onDragMouseDown = (e) => {
      const el = e.currentTarget;
      if (e.button !== 0) return;
      el._dragStartX = e.pageX;
      el._dragScrollLeft = el.scrollLeft;
      el._isDragging = false;
      el.classList.add('is-dragging');
      const onMove = (e2) => {
        const dx = e2.pageX - el._dragStartX;
        if (Math.abs(dx) > 4) el._isDragging = true;
        el.scrollLeft = el._dragScrollLeft - dx;
      };
      const onUp = () => {
        el.classList.remove('is-dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    };
    const onDragClick = (e) => { if (e.currentTarget._isDragging) { e.stopPropagation(); e.currentTarget._isDragging = false; } };
    this._attachScrollListeners = () => {
      document.querySelectorAll('.fpt-scroll').forEach(el => {
        if (!el._fptScrollBound) { el._fptScrollBound = true; el.addEventListener('scroll', onScroll); }
      });
      document.querySelectorAll('.fpt-drag-scroll').forEach(el => {
        if (!el._fptDragBound) { el._fptDragBound = true; el.addEventListener('mousedown', onDragMouseDown); el.addEventListener('click', onDragClick, true); }
      });
    };
    this._scrollObserver = new MutationObserver(this._attachScrollListeners);
    this._scrollObserver.observe(document.body, { childList: true, subtree: true });
    this._attachScrollListeners();
    if (!(window.ZENKaizenDesignSystem_4069b4 || {}).Button) {
      this._poll = setInterval(() => {
        if ((window.ZENKaizenDesignSystem_4069b4 || {}).Button) { clearInterval(this._poll); this.forceUpdate(); }
      }, 60);
    }
    // seed sku active states
    const a = {}; this.SKUS().forEach(s => a[s.code] = s.cms); this.setState({ skuActive: a });
  }
  componentWillUnmount() {
    if (this._poll) clearInterval(this._poll);
    if (this._scrollObserver) this._scrollObserver.disconnect();
    this._scrollTimers && this._scrollTimers.forEach((t, el) => { clearTimeout(t); el.removeEventListener('scroll', null); });
  }

  toggleDark() {
    const next = !this.state.darkMode;
    this.setState({ darkMode: next });
    if (next) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('fpt-cms-dark', '1');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('fpt-cms-dark', '0');
    }
  }

      return h('div', { key: s.code, onClick: () => toggleSkuSelect(s.code), style: { display: 'flex', alignItems: 'flex-start', gap: 8, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', marginBottom: 2, background: isSel ? 'var(--color-accent-bg)' : 'transparent', border: isSel ? '1.5px solid var(--color-accent)' : '1.5px solid transparent' } },
        h('div', { style: { paddingTop: 2 }, onClick: e => e.stopPropagation() },
          h(DS.Checkbox, { checked: isSel, onChange: () => toggleSkuSelect(s.code) })
        ),
        h('label', { title: 'Tải icon gói', onClick: e => e.stopPropagation(), style: { position: 'relative', flexShrink: 0, width: 28, height: 28, marginTop: 1, borderRadius: 6, overflow: 'hidden', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', border: icon ? '1px solid var(--color-border)' : '1.5px dashed var(--color-border-strong)', background: icon ? 'transparent' : 'var(--color-surface)' } },
          icon
            ? h('img', { src: icon, style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } })
            : h(DS.Icon, { name: 'image-line', size: 12, color: 'var(--color-text-subtle)' }),
          h('input', { type: 'file', accept: 'image/*', style: { display: 'none' }, onChange: onSkuIconFile(s.code) })
        ),
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 1 } },
            h('span', { style: { fontWeight: 700, fontSize: 12.5, fontFamily: 'monospace', color: isSel ? 'var(--color-accent)' : 'var(--color-text)' } }, s.code),
            h('span', { style: { fontSize: 10, color: 'var(--color-text-subtle)', background: 'var(--color-surface-alt)', padding: '1px 5px', borderRadius: 4, fontWeight: 500 } }, s.group)
          ),
          h('div', { style: { fontSize: 11.5, color: 'var(--color-text-muted)', marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, s.name),
          h('div', { style: { display: 'flex', gap: 3, flexWrap: 'wrap' } },
            withContent
              ? h('span', { style: { fontSize: 10.5, fontWeight: 600, color: 'var(--color-accent-text)', background: 'var(--color-accent-bg)', padding: '1px 6px', borderRadius: 4 } }, 'Đã có nội dung')
              : h('span', { style: { fontSize: 10.5, fontWeight: 600, color: 'var(--color-text-subtle)', background: 'var(--color-surface-alt)', padding: '1px 6px', borderRadius: 4 } }, 'Chưa có nội dung')
          )
        )
      );
    };

    // ── Helper dùng chung cho khối chỉnh sửa chu kỳ (Gói Internet / Gói SA / Camera) ──
    const renderTaglineSelect = (value, onChange) => checkoutBadgeOptions.length
      ? h(DS.Select, {
          options: [NO_TAGLINE, ...checkoutBadgeOptions], value: value || NO_TAGLINE,
          onChange: val => onChange(val === NO_TAGLINE ? '' : val)
        })
      : h('div', { title: 'Chưa có Badge/Tag phân loại "Check out" — tạo tại Quản lý Badge/Tag.', style: { fontSize: 11, color: 'var(--color-text-subtle)', padding: '9px 0' } }, 'Chưa có Tag line');
    const renderOfferLines = (offers, { onChange, onAdd, onRemove }) => h('div', { style: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 6 } },
      offers.map((o, i) => h('div', { key: i, style: { display: 'flex', gap: 6, alignItems: 'center' } },
        h(DS.Input, { containerStyle: { flex: 1, minWidth: 0 }, defaultValue: o, placeholder: 'Nội dung ưu đãi…', onChange: e => onChange(i, e && e.target ? e.target.value : e) }),
        h(DS.IconButton, { icon: 'x-circle-line', label: 'Xóa nội dung', level: 'tertiary', size: 'sm', onClick: () => onRemove(i) })
      )),
      h(DS.Button, { level: 'secondary', size: 'sm', leadingIcon: 'plus-line', style: { alignSelf: 'flex-start' }, onClick: onAdd }, 'Thêm nội dung')
    );
    // Mỗi khối chu kỳ là 1 card độc lập, phân nhóm rõ 2 khu vực: "Cấu hình chu kỳ" (gói tính cước/chu kỳ)
    // và "Nội dung hiển thị" (tag line/ưu đãi) để dễ quét mắt hơn so với bảng cột phẳng trước đây.
    // Gói tính cước Trả sau ⇒ Chu kỳ luôn khóa về "1 tháng"; Trả trước ⇒ Chu kỳ nhập tự do (Gói Internet dùng input, còn lại dùng select cố định).
    const renderCycleRow = (cy, { showBilling, periodInput, onTagline, onBillingChange, onPeriodChange, onOfferChange, onOfferAdd, onOfferRemove, onRemove, removeDisabled }) => {
      const periodLocked = showBilling ? cy.billingType === 'Trả sau' : true;
      const groupLabelStyle = { fontSize: 10, fontWeight: 700, color: 'var(--color-text-subtle)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 6 };
      return h('div', { key: cy.id, style: { border: '1px solid var(--color-border)', borderRadius: 10, marginBottom: 10, overflow: 'hidden', background: 'var(--color-surface)' } },
      h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, padding: '8px 10px 8px 14px', background: 'var(--color-surface-alt)', borderBottom: '1px solid var(--color-border)' } },
        h('span', { style: { fontSize: 11, fontWeight: 700, color: 'var(--color-text-subtle)', textTransform: 'uppercase', letterSpacing: '.04em' } }, 'Chu kỳ: ' + (cy.period || '—')),
        onRemove && h(DS.IconButton, {
          icon: 'trash-line', label: 'Xóa chu kỳ', level: 'tertiary', size: 'sm',
          disabled: removeDisabled, title: removeDisabled ? 'Phải giữ lại tối thiểu 1 chu kỳ' : 'Xóa chu kỳ này',
          style: { color: removeDisabled ? undefined : 'var(--color-danger-text)' },
          onClick: onRemove
        })
      ),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, padding: '12px 14px' } },
        h('div', null,
          h('div', { style: groupLabelStyle }, 'Cấu hình chu kỳ'),
          showBilling
            ? h('div', { style: { display: 'grid', gridTemplateColumns: '160px 1fr', gap: 10 } },
                h(DS.Select, { options: billingTypeOptions, value: cy.billingType || 'Trả trước', onChange: onBillingChange }),
                h('div', { style: { minWidth: 0 } },
                  periodInput
                    ? h(DS.Input, {
                        value: cy.period || '', placeholder: 'VD: 6 tháng', disabled: periodLocked,
                        title: periodLocked ? 'Trả sau chỉ có chu kỳ 1 tháng' : undefined,
                        onChange: e => onPeriodChange(e && e.target ? e.target.value : e)
                      })
                    : h(DS.Select, {
                        options: periodOptions, value: cy.period || '', placeholder: 'Chọn chu kỳ', disabled: periodLocked,
                        onChange: onPeriodChange
                      })
                )
              )
            : h('div', { style: { width: 160 } }, h(DS.Select, {
                options: periodOptions, value: cy.period || '', placeholder: 'Chọn chu kỳ', disabled: periodLocked,
                onChange: onPeriodChange
              }))
        ),
        h('div', null,
          h('div', { style: groupLabelStyle }, 'Nội dung hiển thị'),
          h('div', { style: { display: 'grid', gridTemplateColumns: '160px 1fr', gap: 10, alignItems: 'flex-start' } },
            renderTaglineSelect(cy.tagline, onTagline),
            renderOfferLines(cy.offers, { onChange: onOfferChange, onAdd: onOfferAdd, onRemove: onOfferRemove })
          )
        )
      )
    );
    };
    // ── Camera: mỗi Gói Cloud là 1 khối gấp/mở riêng (đồng bộ từ QLCS), bên trong là các Chu kỳ con — phân cấp Gói Cloud → Chu kỳ → Tag line/Nội dung ưu đãi.
    const renderCloudPackageBlock = cp => h('div', { key: cp.id, style: { border: '1px solid var(--color-border)', borderRadius: 10, marginBottom: 10, padding: '12px 14px', background: 'var(--color-surface)' } },
      this.collapsibleSection('camCloudOpen_' + cid + '_' + cp.name,
        h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 8 } },
          h(DS.Icon, { name: 'upload-cloud-line', size: 15, color: 'var(--color-accent-text)' }),
          h('span', null, cp.name)
        ),
        h('div', null,
          cp.cycles.map(cy => renderCycleRow(cy, {
            showBilling: false,
            onTagline: val => updateDraftCloudCycle(cp.id, cy.id, { tagline: val }),
            onOfferChange: (i, val) => updateDraftCloudOfferLine(cp.id, cy.id, i, val),
            onOfferAdd: () => addDraftCloudOfferLine(cp.id, cy.id),
            onOfferRemove: i => removeDraftCloudOfferLine(cp.id, cy.id, i)
          }))
        )
      )
    );
    // ── Thiết bị khác: không có khái niệm chu kỳ/tag line, chỉ 1 danh sách Nội dung ưu đãi áp dụng thẳng cho gói ──
    const renderFlatOffersBlock = () => h('div', { style: { padding: '12px 14px' } },
      h('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--color-text-subtle)', textTransform: 'uppercase', letterSpacing: '.03em', marginBottom: 8 } }, 'Nội dung ưu đãi'),
      renderOfferLines(sharedDraft.offers, { onChange: updateDraftFlatOffer, onAdd: addDraftFlatOffer, onRemove: removeDraftFlatOffer })
    );

    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },

      // ── 1. Cấu hình nội dung ──
      h('div', null,
        h('div', { style: { fontSize: 13.5, fontWeight: 700, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 6 } },
          '1. Cấu hình nội dung',
          !isChild && h('span', { style: { color: 'var(--color-danger-text)', marginLeft: 4 } }, '*')
        ),
        h('div', { role: 'tablist', style: { display: 'inline-flex', gap: 4, alignItems: 'stretch', padding: 4, background: 'var(--color-surface-sunken)', borderRadius: 'var(--radius-full)', marginBottom: 14 } },
          mainTabDefs.map(t => {
            const active = t.value === mainTab;
            return h('button', {
              key: t.value, type: 'button', role: 'tab', 'aria-selected': active,
              onClick: () => { setMainTab(t.value); this.setState({ checkoutSkuSearch: '' }); },
              style: {
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
                padding: '8px 16px', fontFamily: 'var(--font-sans)', fontSize: 14, fontWeight: active ? 600 : 500,
                color: active ? 'var(--color-text)' : 'var(--color-text-muted)',
                background: active ? 'var(--color-surface)' : 'transparent',
                border: 'none', borderRadius: 'var(--radius-full)',
                boxShadow: active ? 'var(--shadow-sm)' : 'none',
                cursor: 'pointer', whiteSpace: 'nowrap', transition: 'color var(--dur-fast), background var(--dur-fast)'
              }
            }, this.renderMainTabIcon(t.iconKey, 18), t.label);
          })
        ),
        isInternetMain && h('div', { style: { display: 'flex', borderBottom: '2px solid var(--color-border)', marginBottom: 14, flexWrap: 'wrap' } },
          contentTabDefs.map(t => h('button', { key: t.v, type: 'button', onClick: () => setContentTab(t.v),
            style: {
              display: 'inline-flex', alignItems: 'center', gap: 6,
              padding: '8px 16px', cursor: 'pointer',
              fontFamily: 'inherit', fontSize: 13.5, fontWeight: contentTab === t.v ? 700 : 500,
              border: 'none', background: 'transparent',
              color: contentTab === t.v ? 'var(--color-accent-text)' : 'var(--color-text-subtle)',
              borderBottom: contentTab === t.v ? '2px solid var(--color-accent)' : '2px solid transparent',
              marginBottom: -2, transition: 'all .15s',
            }
          }, t.l))
        ),
        h('p', { style: { fontSize: 12, color: 'var(--color-text-subtle)', margin: '0 0 10px' } },
          effectiveContentTab === 'offers'
            ? 'Tick chọn một hoặc nhiều gói cước ở danh sách bên trái để áp dụng cho trang Checkout — chỉnh sửa nội dung ưu đãi bên phải sẽ áp dụng đồng thời cho tất cả các gói đang được chọn.'
            : 'Tick chọn một hoặc nhiều gói cước ở danh sách bên trái — thiết bị đi kèm & dịch vụ bổ sung được đồng bộ tự động từ QLCS theo từng gói, chỉ có thể chỉnh sửa mô tả và trạng thái hiển thị Web.'
        ),
        h('div', { style: { display: 'grid', gridTemplateColumns: '1.36fr 3fr', gap: 16, alignItems: 'stretch' } },

          // ── Trái: Danh sách gói cước — kiểu giống module Phương thức thanh toán ──
          // (bọc ngoài không sticky, cao bằng hàng grid → cho phép khối bên trong "sticky" bám lại khi cột phải dài hơn)
          h('div', null,
            h('div', { style: { background: 'var(--color-surface-alt)', border: '1px solid var(--color-border)', borderRadius: 10, padding: '12px 10px', position: 'sticky', top: 8 } },
              h('div', { style: { fontSize: 10.5, fontWeight: 700, color: 'var(--color-text-subtle)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 } }, 'DANH SÁCH SẢN PHẨM'),

              // ── Tab nguồn hệ thống ECP / FCP — pill-tab, cùng layout với block "DANH SÁCH SẢN PHẨM" của module Phương thức thanh toán ──
              h('div', {
                role: 'tablist', title: '2 hệ thống cùng đổ dữ liệu sản phẩm về — nếu 1 sản phẩm trùng ở cả ECP và FCP, chỉ cần cấu hình ở đúng 1 tab nguồn là đủ.',
                style: { display: 'flex', gap: 3, padding: 3, background: 'var(--color-surface-sunken)', borderRadius: 'var(--radius-full)', marginBottom: 10 }
              },
                sourceFilterBtns.map(f => {
                  const active = f.id === skuSource;
                  return h('button', {
                    key: f.id, type: 'button', role: 'tab', 'aria-selected': active,
                    onClick: () => setSkuSource(f.id),
                    style: {
                      flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center',
                      padding: '7px 10px', fontFamily: 'var(--font-sans)', fontSize: 13, fontWeight: active ? 700 : 500,
                      color: active ? 'var(--color-text)' : 'var(--color-text-muted)',
                      background: active ? 'var(--color-surface)' : 'transparent',
                      border: 'none', borderRadius: 'var(--radius-full)',
                      boxShadow: active ? 'var(--shadow-sm)' : 'none',
                      cursor: 'pointer', transition: 'color var(--dur-fast), background var(--dur-fast)'
                    }
                  }, f.label);
                })
              ),

              h('div', { style: { marginBottom: 6 } },
                h(DS.Checkbox, { label: 'Chọn tất cả', checked: allChecked, indeterminate: someChecked, onChange: toggleAll })
              ),
              h('div', { style: { marginBottom: 8 } },
                h(DS.Input, { placeholder: 'Lọc mã/tên SKU...', leadingIcon: 'search-medium-line', value: this.state.checkoutSkuSearch || '', onChange: e => this.setState({ checkoutSkuSearch: e && e.target ? e.target.value : e }) })
              ),
              h('div', { className: 'fpt-scroll', style: { display: 'flex', flexDirection: 'column', maxHeight: 512, overflowY: 'auto', overflowX: 'hidden' } },
                filteredSkus.length ? filteredSkus.map(s => renderSkuItem(s)) : h('div', { style: { padding: '16px 6px', textAlign: 'center', fontSize: 12.5, color: 'var(--color-text-subtle)' } }, 'Không tìm thấy SKU phù hợp.')
              )
            )
          ),

          // ── Phải: 1 bộ chỉnh sửa duy nhất, áp dụng đồng thời cho mọi gói đang được chọn ──
          selectedSkus.length === 0
            ? h('div', null,
                !isChild
                  ? h(DS.Alert, { theme: 'warning', title: 'Bắt buộc chọn tối thiểu 1 SKU', style: { borderRadius: 10 } }, 'Vui lòng chọn ít nhất một gói cước ở danh sách bên trái để cấu hình nội dung.')
                  : h('div', { style: { padding: '30px 16px', textAlign: 'center', fontSize: 13, color: 'var(--color-text-subtle)', fontStyle: 'italic', border: '1px dashed var(--color-border)', borderRadius: 10 } },
                      'Chưa chọn gói nào — để trống → kế thừa Global.'
                    )
              )
            : effectiveContentTab !== 'offers'
            ? h('div', { style: { display: 'flex', flexDirection: 'column', gap: 14, minWidth: 0 } },
                selectedSkus.map(sku => renderBundledSkuCard(sku)),
                h('div', { style: { display: 'flex', justifyContent: 'flex-end' } },
                  h(DS.Button, { level: 'primary', size: 'sm', leadingIcon: 'check-line', onClick: saveBundledConfig }, 'Lưu cấu hình')
                )
              )
            : h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, minWidth: 0 } },
                showOverwriteWarning && h(DS.Alert, { theme: 'warning', title: 'Chỉnh sửa sẽ ghi đè nội dung hiện có', style: { borderRadius: 10 } },
                  'Đang chọn ' + selectedSkus.length + ' gói, trong đó ' + selectedWithContent.length + ' gói (' + selectedWithContent.map(s => s.code).join(', ') + ') đã có nội dung ưu đãi. Mọi thay đổi bên dưới sẽ áp dụng đồng loạt và ghi đè — nội dung cũ của các gói này sẽ bị xóa.'
                ),
                h(DS.Card, { style: { padding: 0, overflow: 'hidden', borderRadius: 10 } },
                  h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', borderBottom: '1px solid var(--color-border)', background: 'var(--color-surface-alt)' } },
                    h('div', { style: { flex: 1, minWidth: 0, display: 'flex', flexWrap: 'wrap', gap: 4, alignItems: 'center' } },
                      h('span', { style: { fontSize: 11.5, fontWeight: 700, color: 'var(--color-text-subtle)', marginRight: 2 } }, 'Áp dụng cho ' + selectedSkus.length + ' gói:'),
                      visibleSkus.map(s => h(DS.Tag, { key: s.code, color: 'var(--color-accent)', onClose: () => toggleSkuSelect(s.code) }, s.code)),
                      hiddenSkuCount > 0 && h('button', { type: 'button', onClick: toggleChipsExpanded,
                        style: { fontSize: 11.5, fontWeight: 700, color: 'var(--color-accent-text)', background: 'var(--color-accent-bg)', border: '1px solid var(--color-border)', borderRadius: 20, padding: '4px 10px', cursor: 'pointer' } },
                        '+' + hiddenSkuCount + ' khác'
                      ),
                      chipsExpanded && selectedSkus.length > CHIP_LIMIT && h('button', { type: 'button', onClick: toggleChipsExpanded,
                        style: { fontSize: 11.5, fontWeight: 700, color: 'var(--color-text-subtle)', background: 'transparent', border: 'none', cursor: 'pointer', padding: '4px 2px', textDecoration: 'underline' } },
                        'Thu gọn'
                      )
                    ),
                    h(DS.Button, { level: 'primary', size: 'sm', leadingIcon: 'check-line', style: { flexShrink: 0 }, onClick: saveSharedDraft },
                      'Lưu (' + selectedSkus.length + ' gói)'
                    )
                  ),
                  isCameraMain
                    ? h('div', { style: { padding: 14 } },
                        sharedDraft.cloudPackages.map(cp => renderCloudPackageBlock(cp))
                      )
                    : isOtherMain
                    ? renderFlatOffersBlock()
                    : h('div', { style: { padding: 14 } },
                        sharedDraft.cycles.map(cy => renderCycleRow(cy, {
                          showBilling: isInternetMain,
                          periodInput: isInternetMain,
                          onTagline: val => updateDraftCycle(cy.id, { tagline: val }),
                          onBillingChange: val => updateDraftCycle(cy.id, val === 'Trả sau' ? { billingType: val, period: '1 tháng' } : { billingType: val }),
                          onPeriodChange: val => updateDraftCycle(cy.id, { period: val }),
                          onOfferChange: (i, val) => updateDraftOfferLine(cy.id, i, val),
                          onOfferAdd: () => addDraftOfferLine(cy.id),
                          onOfferRemove: i => removeDraftOfferLine(cy.id, i),
                          onRemove: isInternetMain ? () => confirmRemoveDraftCycle(cy.id) : undefined,
                          removeDisabled: sharedDraft.cycles.length <= 1
                        })),
                        isInternetMain && h(DS.Button, {
                          level: 'secondary', size: 'sm', leadingIcon: 'plus-line',
                          disabled: sharedDraft.cycles.length >= 36,
                          onClick: addDraftCycle
                        }, sharedDraft.cycles.length >= 36 ? 'Đã đủ 36 chu kỳ' : 'Thêm chu kỳ')
                      )
                )
              )
        )
      ),

      // ── 2. Thông điệp truyền thông (chỉ hiện khi đã chọn ≥ 1 gói ở mục 1) ──
      selectedSkus.length > 0 && h('div', null,
        secTitle('announcement-01-line', '2. Thông điệp truyền thông'),
        h('p', { style: { fontSize: 12, color: 'var(--color-text-subtle)', margin: '0 0 6px' } },
          isChild
            ? 'Văn bản hiển thị dưới tóm tắt đơn hàng. Để trống → kế thừa Global.'
            : 'Văn bản hiển thị dưới tóm tắt đơn hàng — dùng để truyền tải ưu đãi, chính sách, lưu ý đến khách hàng trên trang Checkout.'
        ),
        h(DS.Textarea, {
          key: cid + '-msg', defaultValue: msg, rows: 3,
          placeholder: isChild ? 'Để trống → kế thừa từ Global' : 'VD: Đăng ký hôm nay – Miễn phí 3 tháng cước đầu. Hotline hỗ trợ: 1800 6600',
          onChange: e => { const v = e && e.target ? e.target.value : e; this.setState(st => ({ checkoutMsg: { ...st.checkoutMsg, [cid]: v } })); }
        })
      ),

      // ── Footer actions ──
      h('div', { style: { display: 'flex', justifyContent: isCustomChild ? 'space-between' : 'flex-end', alignItems: 'center', gap: 10, borderTop: '1px solid var(--color-border)', paddingTop: 16 } },
        isCustomChild && h(DS.Button, {
          level: 'tertiary', leadingIcon: 'trash-line',
          onClick: () => this.confirm(
            'Xóa cấu hình riêng → về Global?',
            'Mọi tùy chỉnh riêng của kênh này sẽ bị xóa và quay lại dùng cấu hình Global.',
            () => { this.setState(s => ({ inherit: { ...s.inherit, [cid]: true } })); this.closeModal(); this.toast('info', 'Đã khôi phục', 'Kênh đã kế thừa lại Global.'); }
          )
        }, 'Xóa cấu hình riêng → về Global'),
        h(DS.Button, {
          level: 'primary', leadingIcon: 'check-line',

  renderPaymentListTab() {

    const groupOrder = [...this.PAYMENT_METHODS_DEF().map(m => m.id), 'system'];
    const groupIndex = id => { const i = groupOrder.indexOf(id); return i === -1 ? groupOrder.length : i; };

    // Filter/sort state
    const search = (this.state.payListSearch || '').toLowerCase();
    const filterMethod = this.state.payListFilterMethod || 'all';
    const sort = this.state.payListSort || { key: null, dir: 'asc' };

    // Parse "DD/MM/YYYY HH:mm:ss" → timestamp cho sắp xếp theo thời gian
    const parseTime = (s) => {
      if (!s) return 0;
      const [datePart, timePart] = s.split(' ');
      const [dd, mm, yyyy] = (datePart || '').split('/');
      const [hh, mi, ss] = (timePart || '00:00:00').split(':');
      return new Date(+yyyy, +mm - 1, +dd, +hh, +mi, +(ss || 0)).getTime();
    };

    // Áp dụng lọc
    let data = this.getPayListData().filter(r => {
      const skuText = (r.skus || []).join(' ').toLowerCase();
      const methodText = this.PAYMENT_METHOD_LABEL(r.methodId).toLowerCase();
      if (search && !skuText.includes(search) && !methodText.includes(search) && !(r.actor || '').toLowerCase().includes(search)) return false;
      if (filterMethod !== 'all' && r.methodId !== filterMethod) return false;
      return true;
    });

    // Sắp xếp: nhóm theo PTTT là ưu tiên hàng đầu; trong mỗi nhóm sắp theo Thời gian (mới nhất trước) hoặc theo lựa chọn của người dùng
    data = [...data].sort((a, b) => {
      const gi = groupIndex(a.methodId) - groupIndex(b.methodId);
      if (gi !== 0) return gi;
      if (!sort.key) return parseTime(b.time) - parseTime(a.time);
      let av, bv;
      if (sort.key === 'time') { av = parseTime(a.time); bv = parseTime(b.time); }
      else { av = (a.actor || '').toLowerCase(); bv = (b.actor || '').toLowerCase(); }
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
